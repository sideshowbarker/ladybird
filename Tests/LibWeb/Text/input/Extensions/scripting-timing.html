<!doctype html>
<script src="../include.js"></script>
<script src="support-tabs.js"></script>
<script>
    const xhr = new XMLHttpRequest();
    xhr.open("POST", "/echo", false);
    xhr.setRequestHeader("Content-Type", "application/json");
    xhr.send(
        JSON.stringify({
            method: "GET",
            path: "/echo/extension-scripting-timing-slow.js",
            status: 200,
            headers: { "Content-Type": "text/javascript", "Cache-Control": "no-store" },
            body: "window.slowScriptRan = true;",
            delay_ms: 500,
        })
    );
</script>
<script src="/echo/extension-scripting-timing-slow.js"></script>
<body>
    <script>
        // An injection waits for the document to be idle unless it asks to run immediately, which it does while the page
        // is still parsing.
        asyncTest(async done => {
            await contentScriptReady();
            let timing;
            while (!(timing = await sendToBackground({ type: "timing" })))
                await new Promise(resolve => setTimeout(resolve, 20));
            println(`by default, after parsing: ${timing.default !== "loading"}`);
            println(`injectImmediately: ${timing.immediately}`);
            done();
        });
    </script>
</body>
