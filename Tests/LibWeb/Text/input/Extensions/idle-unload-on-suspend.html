<!DOCTYPE html>
<script src="../include.js"></script>
<script src="support-tabs.js"></script>
<body>
<script>
    // runtime.onSuspend runs in every context of an idle page before it unloads, and the next page started sees what
    // their listeners stored.
    asyncTest(async done => {
        await contentScriptReady();
        const id = internals.extensionId("Suspend Fixture");
        await sendToBackground({ type: "frame-loaded" });
        println(`before: ${await sendToBackground({ type: "count" })}, ${await sendToBackground({ type: "count" })}`);
        internals.setExtensionIdleTimeout(id, 50);
        await new Promise(resolve => setTimeout(resolve, 500));
        const stored = await sendToBackground({ type: "read" });
        println(`stored while suspending: ${stored.suspendedAfter}, frame: ${stored.frameSuspended}`);
        println(`after: ${await sendToBackground({ type: "count" })}`);
        internals.setExtensionIdleTimeout(id, 30000);
        done();
    });
</script>
</body>
