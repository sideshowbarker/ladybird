<!doctype html>
<script src="../include.js"></script>
<script src="support-tabs.js"></script>
<body>
    <script>
        // A popup isn't a tab, so tabs.update() with no id from a popup changes the tab whose button opened it.
        asyncTest(async done => {
            await contentScriptReady();
            const id = internals.extensionId("Tabs Create Fixture");
            const myTab = await sendToBackground({ type: "my-tab" });
            internals.clickExtensionAction(id);
            let result;
            while ((result = await sendToBackground({ type: "popup-result" })) === null)
                await new Promise(resolve => setTimeout(resolve, 20));
            println(`changed the tab that opened the popup: ${result === myTab}`);
            if (JSON.parse(internals.extensionPopupState(id)).open) internals.clickExtensionAction(id);
            done();
        });
    </script>
</body>
