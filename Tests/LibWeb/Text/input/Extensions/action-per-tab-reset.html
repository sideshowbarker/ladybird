<!DOCTYPE html>
<script src="../include.js"></script>
<script src="support-tabs.js"></script>
<body>
<script>
    // A tab's own action values survive its same-document navigations and are dropped when it loads another document.
    asyncTest(async done => {
        await contentScriptReady();
        // Tests run at once, sharing the fixture's background page, so this one's child window reports under a token.
        const run = String(Math.random()).slice(2);
        const child = window.open(`../../data/extension-child-window.html?first&run=${run}`);
        let state;
        for (let i = 0; i < 200; ++i) {
            state = await sendToBackground({ type: "child-state", run });
            if (state.afterNavigation)
                break;
            await new Promise(resolve => setTimeout(resolve, 25));
        }
        println(`after same-document navigations: ${JSON.stringify(state.afterSameDocument)}`);
        println(`after loading another document: ${JSON.stringify(state.afterNavigation)}`);
        child.close();
        done();
    });
</script>
</body>
