<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    asyncTest(async done => {
        if (!document.documentElement.dataset.portOutput)
            await new Promise(resolve => document.addEventListener("port-finished", resolve, { once: true }));
        for (const line of JSON.parse(document.documentElement.dataset.portOutput))
            println(line);
        done();
    });
</script>
