<!DOCTYPE html>
<div id="target"></div>
<script src="../include.js"></script>
<script>
    asyncTest(async done => {
        if (!document.documentElement.dataset.i18nOutput)
            await new Promise(resolve => document.addEventListener("i18n-finished", resolve, { once: true }));
        for (const line of JSON.parse(document.documentElement.dataset.i18nOutput))
            println(line);
        done();
    });
</script>
